<title>PVT Firmware-Baukasten</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: ein Werkzeug in drei nummerierten Schritten (Laden → Einstellen → Bauen), eine Spalte, Daten in Mono. */
:root {
  --bg: #eef1f5; --surface: #ffffff; --surface-2: #f6f8fb; --fg: #16202b; --muted: #5d6978; --line: #d3dae3;
  --accent: #1d5fd6; --accent-ink: #ffffff; --accent-soft: #e4ecfb;
  --ok: #1f8a4c; --ok-soft: #e3f3e9; --warn: #a86a0f; --warn-soft: #fbefd7; --bad: #c2382b; --bad-soft: #fbe5e2;
  --code-bg: #eaf0fa; --shadow: 0 1px 2px rgba(22,32,43,.06), 0 8px 24px rgba(22,32,43,.06);
  --sans: "Schibsted Grotesk", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f141b; --surface: #171e27; --surface-2: #1d2631; --fg: #e5ebf3; --muted: #9aa7b6; --line: #2b3643;
  --accent: #6b98ff; --accent-ink: #0b1220; --accent-soft: #1b2a45;
  --ok: #46bd78; --ok-soft: #15301f; --warn: #e3ac45; --warn-soft: #3a2b0f; --bad: #ef6a5c; --bad-soft: #3d1a16;
  --code-bg: #1a2432; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f141b; --surface: #171e27; --surface-2: #1d2631; --fg: #e5ebf3; --muted: #9aa7b6; --line: #2b3643;
  --accent: #6b98ff; --accent-ink: #0b1220; --accent-soft: #1b2a45;
  --ok: #46bd78; --ok-soft: #15301f; --warn: #e3ac45; --warn-soft: #3a2b0f; --bad: #ef6a5c; --bad-soft: #3d1a16;
  --code-bg: #1a2432; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 48px; }
main, header, footer { max-width: 900px; margin-inline: auto; }
header { padding-block: 32px 8px; }
h1 { font-size: clamp(26px, 4vw, 34px); font-weight: 700; letter-spacing: -.01em; margin: 0 0 6px; text-wrap: balance; }
.lede { color: var(--muted); margin: 0; max-width: 62ch; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
h2 { font-size: 19px; font-weight: 600; margin: 0; display: flex; align-items: baseline; gap: 12px; }
h2 .n { font-family: var(--mono); font-size: 13px; color: var(--accent); font-weight: 600; }
h3 { font-size: 15px; font-weight: 600; margin: 0 0 8px; }
section.step { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 20px; margin-top: 18px; }
section.step > h2 { margin-bottom: 12px; }
p { margin: 0 0 10px; }
.muted { color: var(--muted); }
small, .small { font-size: 13px; }
code, .mono { font-family: var(--mono); font-size: 13px; }
code { background: var(--code-bg); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
.hash { font-family: var(--mono); font-size: 12px; word-break: break-all; background: var(--code-bg); padding: 6px 8px; border-radius: 6px; display: block; }

/* Schritt 1 */
.drop { border: 2px dashed var(--line); border-radius: 10px; padding: 26px 18px; text-align: center; background: var(--surface-2); transition: border-color .15s, background .15s; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop p { margin: 0 0 10px; }
.filebtn { display: inline-block; }
.filebtn input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.btn { font: inherit; font-weight: 600; padding: 9px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .5; cursor: not-allowed; filter: none; }
.btn:focus-visible, input:focus-visible, select:focus-visible, .filebtn:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.sm { padding: 5px 10px; font-size: 13px; font-weight: 500; }
.status { border-radius: 8px; padding: 12px 14px; border: 1px solid var(--line); margin-top: 14px; }
.status.ok { background: var(--ok-soft); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
.status.warn { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
.status.bad { background: var(--bad-soft); border-color: color-mix(in srgb, var(--bad) 40%, transparent); }
.status strong { display: block; margin-bottom: 4px; }
.entries { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 6px; }
.entries label { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; background: var(--surface); }
.entries label.sel { border-color: var(--accent); background: var(--accent-soft); }
.entries input { margin-top: 4px; }
.entries label > span { min-width: 0; overflow-wrap: anywhere; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin-top: 10px; font-size: 14px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; font-family: var(--mono); font-size: 13px; min-width: 0; overflow-wrap: anywhere; }

/* Schritt 2 */
.presets { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px 18px; }
.field label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 4px; }
.field .hint { color: var(--muted); font-size: 13px; margin-top: 4px; }
.field input[type=number], .field select { font: inherit; width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--fg); font-variant-numeric: tabular-nums; }
.check { display: flex; gap: 10px; align-items: flex-start; }
.check input { margin-top: 5px; width: 16px; height: 16px; }
.tfrow { display: flex; gap: 8px; } .tfrow select, .tfrow input { flex: 1; min-width: 0; }
details.expert { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 12px; }
details.expert summary { cursor: pointer; font-weight: 600; }
details.expert .grid { margin-top: 12px; }
.sum { margin-top: 18px; padding: 14px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); }
.sum .top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.sum .val { font-family: var(--mono); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.bar { position: relative; height: 12px; border-radius: 6px; background: var(--line); margin: 10px 0 6px; overflow: hidden; }
.bar .fill { height: 100%; width: 0; background: var(--ok); transition: width .2s; }
.bar .fill.warn { background: var(--warn); } .bar .fill.bad { background: var(--bad); }
.bar .mark { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--fg); opacity: .6; }
.ticks { position: relative; height: 18px; font-size: 12px; color: var(--muted); font-family: var(--mono); } .ticks span { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; } .ticks span.first { transform: none; } .ticks span.last { transform: translateX(-100%); } .ticks span.wall { color: var(--bad); }
.notes { margin: 10px 0 0; padding-left: 18px; font-size: 14px; } .notes li { margin: 3px 0; }
.notes li.bad { color: var(--bad); } .notes li.warn { color: var(--warn); }

/* Schritt 3 */
.result { margin-top: 14px; }
.result .head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; }
.result .label { font-family: var(--mono); font-size: 18px; font-weight: 600; overflow-wrap: anywhere; min-width: 0; }
.badge { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; }
.badge.ok { background: var(--ok-soft); color: var(--ok); } .badge.warn { background: var(--warn-soft); color: var(--warn); } .badge.bad { background: var(--bad-soft); color: var(--bad); }
.tablewrap { overflow-x: auto; margin-top: 12px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; }
td.mono, th.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; align-items: center; }
.actions .btn { max-width: 100%; overflow-wrap: anywhere; white-space: normal; text-align: left; }
#saveMsg { font-size: 14px; }

/* Hilfe */
ol.steps { padding-left: 20px; } ol.steps li { margin: 6px 0; }
details.help { margin-top: 10px; } details.help summary { cursor: pointer; font-weight: 600; }
details.help > *:not(summary) { margin-top: 8px; }
footer { color: var(--muted); font-size: 13px; padding-top: 24px; }
@media (prefers-reduced-motion: reduce) { .bar .fill, .drop { transition: none; } }
</style>
